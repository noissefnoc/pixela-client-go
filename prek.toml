# See https://prek.j178.dev for configuration reference

[[repos]]
repo = "local"
hooks = [
  { id = "jactionlint", name = "jactionlint", entry = "jactionlint", language = "system", files = '^.github/workflows/.*\.ya?ml$' },
  { id = "zizmor", name = "zizmor", entry = "zizmor .", language = "system", files = '^.github/workflows/.*\.ya?ml$', pass_filenames = false },
  { id = "actions-lock", name = "actions-lock", entry = "gh actions-lock --verify", language = "system", files = '^.github/workflows/.*', pass_filenames = false },
]
